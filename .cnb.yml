main:
  push:
    - stages:
        - name: build-and-push
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      services:
        - docker
    - name: sync-to-github
      image: tencentcom/git-sync
      # 前置条件（需手动完成一次）：
      # 1. GitHub → Settings → Developer settings → Personal access tokens →
      #    Tokens (classic) → Generate new token，勾选 repo 权限，复制 ghp_ 开头的 token
      # 2. 在 CNB 创建"密钥仓库"（如 CR7_worldcup/secrets），新建 github.yml：
      #      GITHUB_USER: chaodong695-stack
      #      GITHUB_TOKEN: ghp_你的token
      # 3. 确认下方 imports 地址与实际密钥仓库路径一致
      imports: https://cnb.cool/CR7_worldcup/secrets/-/blob/main/github.yml
      settings:
        target_url: https://github.com/chaodong695-stack/eco-seeder.git
        auth_type: https
        username: ${GITHUB_USER}
        password: ${GITHUB_TOKEN}
        branch: main
        force: true   # GitHub 仓库曾有分叉，强制推送保持与 CNB 一致

$:
  vscode:
    - runner:
        cpus: 16
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: true
            launch: >-
              sh -lc "docker rm -f eco-seeder-preview 2>/dev/null || true;
              docker run -d --name eco-seeder-preview --network host
              -e PORT=8686
              -e CNB_API_ENDPOINT
              -e CNB_REPO_SLUG
              -e CNB_TOKEN
              ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
            keepAliveTimeout: 3600000
            daemon: true
